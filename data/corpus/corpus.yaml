    version: "Compendium Version-IV (14.12.2022); last amendment listed: 13 Dec 2022"
    source_url: "https://www.fssai.gov.in/upload/uploadfiles/files/Compendium_Advertising_Claims_Regulations_14_12_2022.pdf"
