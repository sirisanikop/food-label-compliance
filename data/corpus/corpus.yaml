    source_url: "https://www.fssai.gov.in/upload/uploadfiles/files/Compendium_Labelling_Display_04_01_2022.pdf"

  - doc_id: FSSAI-ADV-CLAIMS-2018
    title: Food Safety and Standards (Advertising and Claims) Regulations, 2018
    role: claims
