# Requires Docker Compose v2.24+ (optional env_file entries).
# Clean clone:  docker compose up --build
# Scale agents: docker compose up --build --scale worker=3
name: foodlabel

x-app-env: &app-env
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  # ------------------------------------------------------------ data plane
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  indexer:
    # One-shot job: parse -> chunk -> embed -> index the corpus (D2). Idempotent.
    build: { context: ., dockerfile: services/indexer/Dockerfile }
    <<: *app-env
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - index-data:/app/data/index
    restart: "no"

  llm-stub:
    # Stands in for the model provider in load tests and by default (D6).
    build: { context: ., dockerfile: services/stub_llm/Dockerfile }
    <<: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ application
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    <<: *app-env
    environment: { SERVICE_NAME: api }
    ports: ["8000:8000"]
    volumes: [quarantine-data:/app/data/quarantine]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Analyst agent. Scale with --scale worker=3. No container_name / fixed host port.
    build: { context: ., dockerfile: services/worker/Dockerfile }
    <<: *app-env
    environment: { SERVICE_NAME: worker }
    volumes: [index-data:/app/data/index:ro]
    depends_on:
      redis: { condition: service_healthy }
      indexer: { condition: service_completed_successfully }
      verifier: { condition: service_healthy }
      llm-stub: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  verifier:
    # Verifier agent: separate service so it can fail, scale and be released independently.
    build: { context: ., dockerfile: services/verifier/Dockerfile }
    <<: *app-env
    environment: { SERVICE_NAME: verifier }
    depends_on:
      redis: { condition: service_healthy }
      llm-stub: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  # ------------------------------------------------------------ observability
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api]

  cadvisor:
    # Per-container CPU / memory (D5). Needs host access; may be limited on some Docker Desktop setups.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["8081:8080"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ------------------------------------------------------------ load test (profile)
  locust:
    image: locustio/locust:2.29.1
    profiles: ["loadtest"]
    volumes: ["./loadtest:/mnt/locust"]
    command: >
      -f /mnt/locust/locustfile.py --host http://api:8000 --headless
      -u ${LOCUST_USERS:-10} -r ${LOCUST_SPAWN_RATE:-2} -t ${LOCUST_RUN_TIME:-2m}
      --csv /mnt/locust/results/run
    depends_on:
      api: { condition: service_healthy }

volumes:
  redis-data:
  index-data:
  quarantine-data:
  prometheus-data:
